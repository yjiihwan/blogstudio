[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]
aptPkgs = []

[phases.install]
cmds = ["npm ci --ignore-scripts=false"]

[phases.build]
cmds = [
  "npm run build",
  "cp -r drizzle .next/standalone/drizzle",
  "cp -r node_modules/better-sqlite3 .next/standalone/node_modules/better-sqlite3"
]

[start]
cmd = "node .next/standalone/server.js"
